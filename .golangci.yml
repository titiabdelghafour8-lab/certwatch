run:
  timeout: 5m

linters:
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - revive
    - unconvert
    - unparam
    - whitespace

linters-settings:
  gosec:
    excludes:
      - G104 # unhandled errors are covered by errcheck
  revive:
    rules:
      - name: exported
        disabled: true
      - name: package-comments
        disabled: true
  gocritic:
    disabled-checks:
      - ifElseChain

issues:
  exclude-rules:
    - path: _test\.go
      linters: [gosec, noctx, bodyclose, errcheck, unparam]
